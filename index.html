<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부 - 스마트 금융 관리</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> 스마트 가계부</h1>
            <p class="subtitle">지출과 수입을 한눈에 관리하세요</p>
            <div class="header-actions">
                <a href="#contact-section" class="nav-link-btn" title="비즈니스 제휴 문의">
                    <i class="fas fa-handshake"></i>
                    <span>제휴 문의</span>
                </a>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                    <span>다크 모드</span>
                </button>
            </div>
        </header>

        <section class="summary-cards">
            <div class="card balance">
                <h3>현재 잔액</h3>
                <p id="balance">₩ 0</p>
            </div>
            <div class="card income">
                <h3>총 수입</h3>
                <p id="total-income">₩ 0</p>
            </div>
            <div class="card expense">
                <h3>총 지출</h3>
                <p id="total-expense">₩ 0</p>
            </div>
        </section>

        <main class="main-content">
            <section class="chart-section">
                <div class="card">
                    <h3>지출 카테고리별 비중</h3>
                    <div class="chart-container">
                        <canvas id="expense-chart"></canvas>
                    </div>
                </div>
            </section>

            <section class="transaction-section">
                <div class="card">
                    <div class="card-header">
                        <h3>거래 내역</h3>
                        <button id="add-btn" class="btn-primary"><i class="fas fa-plus"></i> 추가하기</button>
                    </div>
                    <ul id="transaction-list" class="transaction-list">
                        <!-- 내역이 여기에 추가됩니다 -->
                    </ul>
                </div>
            </section>
        </main>

        <!-- 제휴 문의 섹션 -->
        <section id="contact-section" class="contact-section">
            <div class="card">
                <div class="section-header">
                    <h2><i class="fas fa-handshake"></i> 제휴 및 비즈니스 문의</h2>
                    <p class="subtitle">스마트 가계부와 함께 성장할 파트너십 제안을 환영합니다.</p>
                </div>

                <!-- 상태 알림 메시지 (에러 시 표시) -->
                <div id="contact-status-message" class="status-message" role="alert"></div>

                <!-- 문의 완료 안내 화면 -->
                <div id="contact-success-box" class="success-box">
                    <i class="fas fa-check-circle"></i>
                    <h3>문의가 정상적으로 접수되었습니다!</h3>
                    <p>소중한 제안 감사드립니다.<br>보내주신 내용을 신속히 검토한 후 기재해주신 이메일로 회신드리겠습니다.</p>
                    <button type="button" id="btn-reset-contact" class="btn-outline">
                        <i class="fas fa-redo"></i> 추가 문의 작성하기
                    </button>
                </div>

                <!-- Formspree 폼 -->
                <form id="partnership-form" action="https://formspree.io/f/xbggwqoo" method="POST">
                    <input type="hidden" name="_subject" value="[스마트 가계부] 새로운 제휴 문의가 접수되었습니다">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="company">회사 / 단체명 <span class="required-star">*</span></label>
                            <input type="text" id="company" name="company" placeholder="예: (주)파트너스" required>
                        </div>
                        <div class="form-group">
                            <label for="name">담당자 성함 <span class="required-star">*</span></label>
                            <input type="text" id="name" name="name" placeholder="예: 홍길동 팀장" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">담당자 이메일 <span class="required-star">*</span></label>
                            <input type="email" id="email" name="email" placeholder="example@company.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">연락처</label>
                            <input type="tel" id="phone" name="phone" placeholder="예: 010-1234-5678">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="partnership_type">제휴 분류 <span class="required-star">*</span></label>
                        <select id="partnership_type" name="partnership_type" required>
                            <option value="" disabled selected>제휴 유형을 선택해 주세요</option>
                            <option value="비즈니스 제휴">비즈니스 / 사업 제휴</option>
                            <option value="마케팅 및 광고">마케팅 / 광고 / 프로모션</option>
                            <option value="기능 및 API 연동">기능 연동 / 데이터 API 제휴</option>
                            <option value="콘텐츠 제휴">콘텐츠 / 칼럼 제휴</option>
                            <option value="기타 제휴">기타 문의</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="website">회사 또는 서비스 URL</label>
                        <input type="url" id="website" name="website" placeholder="https://example.com">
                    </div>

                    <div class="form-group">
                        <label for="message">제휴 제안 상세 내용 <span class="required-star">*</span></label>
                        <textarea id="message" name="message" rows="4" placeholder="제휴 목적, 기대 효과, 제안 배경 등을 자유롭게 작성해 주세요." required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="privacy" name="privacy_agreed" value="동의함" required>
                        <label for="privacy">
                            <strong>(필수)</strong> 개인정보 수집 및 이용(문의 응대 및 이메일 회신 목적)에 동의합니다.
                        </label>
                    </div>

                    <button type="submit" id="contact-submit-btn" class="btn-block">
                        <i class="fas fa-paper-plane"></i>
                        <span>문의 보내기</span>
                    </button>
                </form>
            </div>
        </section>

        <footer class="footer">
            <p>© 2026 스마트 가계부. All rights reserved.</p>
        </footer>
    </div>

    <!-- Modal for adding transaction -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>거래 추가</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="text">내용</label>
                    <input type="text" id="text" placeholder="예: 점심 식사, 급여..." required>
                </div>
                <div class="form-group">
                    <label for="amount">금액 (수입은 +, 지출은 -)</label>
                    <input type="number" id="amount" placeholder="예: -10000, 50000" required>
                </div>
                <div class="form-group">
                    <label for="category">카테고리</label>
                    <select id="category" required>
                        <option value="식비">식비</option>
                        <option value="교통">교통</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="의료">의료</option>
                        <option value="수입">수입</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <button type="submit" class="btn-block">추가</button>
            </form>
        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
